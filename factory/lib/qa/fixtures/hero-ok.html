<!doctype html>
<html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixture: hero that fits at 390px</title>
<style>
  * { box-sizing: border-box; } body { margin: 0; font-family: sans-serif; }
  .wrap { width: min(100% - 2rem, 60rem); margin-inline: auto; }
  .hero { background: #1D4A2F; color: #F3F4EF; padding-block: 1rem 2rem; }
  h1 { font-size: 2.5rem; line-height: 1; margin: 0; overflow-wrap: anywhere; }
  .headline { font-size: 1.2rem; max-width: 34ch; }
  figure { margin: 0; aspect-ratio: 4 / 3; background: #E6E8E0; }
  img { max-width: 100%; height: auto; }
</style></head>
<body>
<header class="hero">
  <div class="wrap">
    <h1>Restorant Te Ymeri</h1>
    <p class="headline">Skara e vërtetë e Prishtinës, çdo ditë nga ora 8.</p>
    <figure><img src="pixel.png" alt="" width="1600" height="1200"></figure>
  </div>
</header>
<main class="wrap"><p>Menyja</p></main>
</body></html>
